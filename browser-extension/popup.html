<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>发送到无限画布</title>
        <style>
            body {
                width: 340px;
                margin: 0;
                padding: 12px;
                font: 400 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
                color: #1f1f1f;
            }
            h1 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
            .hint { color: #6b7280; font-size: 12px; }
            .hint a { color: #2563eb; text-decoration: none; }
            #list { max-height: 320px; overflow: auto; margin: 10px 0; }
            label.item { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid #f1f1f1; }
            label.item.disabled { opacity: 0.5; }
            .thumb { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; background: #f3f3f3; flex: none; }
            .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
            .tag { font-size: 11px; color: #6b7280; flex: none; }
            .bar { display: flex; gap: 8px; align-items: center; }
            button {
                height: 30px;
                padding: 0 14px;
                border: none;
                border-radius: 8px;
                background: #111827;
                color: #fff;
                font-size: 13px;
                cursor: pointer;
            }
            button[disabled] { background: #d1d5db; cursor: not-allowed; }
            button.ghost { background: #f3f4f6; color: #374151; }
            #status { margin-top: 8px; font-size: 12px; color: #6b7280; min-height: 18px; }
            .drop {
                margin: 0 0 12px;
                padding: 14px 10px;
                border: 1px dashed #d1d5db;
                border-radius: 10px;
                background: #fafafa;
                text-align: center;
                transition: border-color 0.15s ease, background 0.15s ease;
            }
            .drop.over { border-color: #111827; background: #f3f4f6; }
            .drop .t { font-size: 13px; font-weight: 600; }
            .drop .s { margin-top: 3px; font-size: 12px; color: #6b7280; }
            .drop button { margin-top: 8px; height: 28px; font-size: 12px; }
            hr { margin: 12px 0; border: none; border-top: 1px solid #f1f1f1; }
        </style>
    </head>
    <body>
        <div class="drop" id="drop">
            <div class="t">本机图片 / 视频</div>
            <div class="s">把文件拖到这里，或点下方按钮选择（可多选）</div>
            <button id="pick">选择本机文件</button>
            <input type="file" id="file" accept="image/*,video/*" multiple hidden />
        </div>
        <h1>本页图片 / 视频</h1>
        <p class="hint" id="lead">读取中…</p>
        <div id="list"></div>
        <div class="bar">
            <button id="send">发送选中</button>
            <button id="all" class="ghost">全选</button>
            <button id="options" class="ghost">设置</button>
        </div>
        <p id="status"></p>
        <script src="popup.js"></script>
    </body>
</html>
